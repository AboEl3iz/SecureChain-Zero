# k8s/network-policy.yaml
# Prevents data exfiltration and C2 callback after RCE
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-app-strict-egress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: secure-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
    # Internal services only — NO arbitrary internet egress
    - to:
        - namespaceSelector:
            matchLabels:
              network-zone: internal
